
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9 - Funções JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Atividade 9 - Funções JavaScript</h1>

    <div class="container">
        <h2>1 - Maior Número</h2>
        <p>Digite três números:</p>

        <input type="number" id="numero1" placeholder="Primeiro número">
        <input type="number" id="numero2" placeholder="Segundo número">
        <input type="number" id="numero3" placeholder="Terceiro número">

        <button onclick="exercicio1()">Verificar</button>
        <p id="resultado1"></p>
    </div>

    <div class="container">
        <h2>2 - Ordem Crescente</h2>
        <p>Digite três números:</p>

        <input type="number" id="num1" placeholder="Primeiro número">
        <input type="number" id="num2" placeholder="Segundo número">
        <input type="number" id="num3" placeholder="Terceiro número">

        <button onclick="exercicio2()">Ordenar</button>
        <p id="resultado2"></p>
    </div>

    <div class="container">
        <h2>3 - Palíndromo</h2>
        <p>Digite uma palavra ou frase:</p>

        <input type="text" id="palavra" placeholder="Digite aqui">

        <button onclick="exercicio3()">Verificar</button>
        <p id="resultado3"></p>
    </div>

    <div class="container">
        <h2>4 - Subconjunto</h2>
        <p>Digite duas palavras:</p>

        <input type="text" id="palavra1" placeholder="Primeira palavra">
        <input type="text" id="palavra2" placeholder="Segunda palavra">

        <button onclick="exercicio4()">Verificar</button>
        <p id="resultado4"></p>
    </div>

    <div class="container">
        <h2>5 - Dia da Semana</h2>
        <p>Selecione uma data:</p>

        <input type="date" id="data">

        <button onclick="exercicio5()">Verificar</button>
        <p id="resultado5"></p>
    </div>
</body>
</html>
